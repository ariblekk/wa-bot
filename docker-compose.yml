services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ariblekk/wabot:1.0.0
    container_name: wa-chatbot
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV}
      APP_HOST: ${APP_HOST}
      APP_PORT: ${APP_PORT}
      APP_READ_TIMEOUT_SECONDS: ${APP_READ_TIMEOUT_SECONDS}
      APP_WRITE_TIMEOUT_SECONDS: ${APP_WRITE_TIMEOUT_SECONDS}
      APP_SHUTDOWN_TIMEOUT_SECONDS: ${APP_SHUTDOWN_TIMEOUT_SECONDS}
      APP_DEBUG: ${APP_DEBUG}
      APP_TIMEZONE: ${APP_TIMEZONE}
      WEBHOOK_PATH: ${WEBHOOK_PATH}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL}
      OPENAI_CHAT_COMPLETIONS_PATH: ${OPENAI_CHAT_COMPLETIONS_PATH}
      OPENAI_CHAT_COMPLETIONS_URL: ${OPENAI_CHAT_COMPLETIONS_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL}
      OPENAI_SYSTEM_PROMPT_FILE: ${OPENAI_SYSTEM_PROMPT_FILE}
      OPENAI_SYSTEM_PROMPT: ${OPENAI_SYSTEM_PROMPT}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS}
      OPENAI_MAX_TOKENS: ${OPENAI_MAX_TOKENS}
      CHAT_MEMORY_ENABLED: ${CHAT_MEMORY_ENABLED}
      CHAT_MEMORY_MAX_MESSAGES: ${CHAT_MEMORY_MAX_MESSAGES}
      CHAT_MEMORY_TTL_HOURS: ${CHAT_MEMORY_TTL_HOURS}
      POSTGRES_DSN: ${POSTGRES_DSN}
      POSTGRES_MAX_CONNS: ${POSTGRES_MAX_CONNS}
      POSTGRES_MIN_CONNS: ${POSTGRES_MIN_CONNS}
      GOWA_BASE_URL: ${GOWA_BASE_URL}
      GOWA_SEND_MESSAGE_PATH: ${GOWA_SEND_MESSAGE_PATH}
      GOWA_READ_MESSAGE_PATH: ${GOWA_READ_MESSAGE_PATH}
      GOWA_CHAT_PRESENCE_PATH: ${GOWA_CHAT_PRESENCE_PATH}
      GOWA_DOWNLOAD_MEDIA_PATH: ${GOWA_DOWNLOAD_MEDIA_PATH}
      GOWA_SEND_VIDEO_PATH: ${GOWA_SEND_VIDEO_PATH:-/send/video}
      GOWA_SEND_AUDIO_PATH: ${GOWA_SEND_AUDIO_PATH:-/send/audio}
      GOWA_MEDIA_TIMEOUT_SECONDS: ${GOWA_MEDIA_TIMEOUT_SECONDS}
      GOWA_API_KEY: ${GOWA_API_KEY}
      GOWA_BASIC_AUTH: ${GOWA_BASIC_AUTH}
      GOWA_DEVICE_ID: ${GOWA_DEVICE_ID}
      GOWA_TIMEOUT_SECONDS: ${GOWA_TIMEOUT_SECONDS}
      ALLOW_GROUP_MESSAGES: ${ALLOW_GROUP_MESSAGES}
      HUMANIZE_ENABLED: ${HUMANIZE_ENABLED}
      HUMANIZE_MIN_TYPING_SECONDS: ${HUMANIZE_MIN_TYPING_SECONDS}
      IMAGE_ENABLED: ${IMAGE_ENABLED}
      IMAGE_MAX_BYTES: ${IMAGE_MAX_BYTES}
      METUBE_ENABLED: ${METUBE_ENABLED}
      METUBE_BASE_URL: ${METUBE_BASE_URL}
      METUBE_API_KEY: ${METUBE_API_KEY}
      METUBE_ADD_PATH: ${METUBE_ADD_PATH}
      METUBE_HISTORY_PATH: ${METUBE_HISTORY_PATH}
      METUBE_VIDEO_FILE_PATH: ${METUBE_VIDEO_FILE_PATH}
      METUBE_AUDIO_FILE_PATH: ${METUBE_AUDIO_FILE_PATH}
      METUBE_VIDEO_QUALITY: ${METUBE_VIDEO_QUALITY}
      METUBE_VIDEO_FORMAT: ${METUBE_VIDEO_FORMAT}
      METUBE_VIDEO_CODEC: ${METUBE_VIDEO_CODEC}
      METUBE_AUDIO_FORMAT: ${METUBE_AUDIO_FORMAT}
      METUBE_ALLOWED_HOSTS: ${METUBE_ALLOWED_HOSTS}
      METUBE_AUDIO_ONLY_HOSTS: ${METUBE_AUDIO_ONLY_HOSTS}
      METUBE_POLL_SECONDS: ${METUBE_POLL_SECONDS}
      METUBE_WAIT_TIMEOUT_SECONDS: ${METUBE_WAIT_TIMEOUT_SECONDS}
      METUBE_REQUEST_TIMEOUT_SECONDS: ${METUBE_REQUEST_TIMEOUT_SECONDS}
      METUBE_ADD_TIMEOUT_SECONDS: ${METUBE_ADD_TIMEOUT_SECONDS}
    ports:
      - "${APP_PORT}:${APP_PORT}"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - wa-network

  postgres:
    image: postgres:16-alpine
    container_name: wa-chatbot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - wa-network

volumes:
  postgres_data:

networks:
  wa-network:
    driver: bridge
