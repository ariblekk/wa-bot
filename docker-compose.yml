services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: wa-chatbot:latest
    container_name: wa-chatbot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_HOST: ${APP_HOST:-0.0.0.0}
      APP_PORT: ${APP_PORT:-8080}
      OPENAI_SYSTEM_PROMPT_FILE: ${OPENAI_SYSTEM_PROMPT_FILE:-./prompts/system.txt}
      CHAT_MEMORY_ENABLED: ${CHAT_MEMORY_ENABLED:-true}
      POSTGRES_DSN: "${POSTGRES_DSN:-postgresql://wa_chatbot:change-this-password@postgres:5432/wa_chatbot?sslmode=disable}"
      POSTGRES_MAX_CONNS: ${POSTGRES_MAX_CONNS:-10}
      POSTGRES_MIN_CONNS: ${POSTGRES_MIN_CONNS:-2}
    ports:
      - "${APP_PORT:-8080}:${APP_PORT:-8080}"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - wa-network

  postgres:
    image: postgres:16-alpine
    container_name: wa-chatbot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wa_chatbot}
      POSTGRES_USER: ${POSTGRES_USER:-wa_chatbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-password}
    # PostgreSQL hanya diakses oleh service app melalui network internal Docker.
    # Jangan expose port 5432 ke host/Dokploy karena biasanya sudah terpakai.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - wa-network

volumes:
  postgres_data:

networks:
  wa-network:
    driver: bridge
