services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: wa-chatbot:latest
    container_name: wa-chatbot
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - wa-network

  postgres:
    image: postgres:16-alpine
    container_name: wa-chatbot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wa_chatbot}
      POSTGRES_USER: ${POSTGRES_USER:-wa_chatbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - wa-network

volumes:
  postgres_data:

networks:
  wa-network:
    driver: bridge
